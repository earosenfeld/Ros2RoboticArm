# CI for the pure-Python kinematics library (robot_arm/) and its pytest suite.
#
# NOTE: This workflow intentionally does NOT build the ROS 2 package or run a
# colcon build. The ROS 2 nodes (ros2_nodes/) require a full ROS 2 + MoveIt
# environment that is impractical to provision here. The kinematics library is
# the part that is unit-tested in CI; the ROS 2 nodes are scaffolding that must
# be run inside a ROS 2 workspace.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kinematics-tests:
    name: Kinematics tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest matplotlib

      - name: Run tests
        run: python -m pytest tests/ -q
